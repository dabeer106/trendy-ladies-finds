<script>
document.addEventListener('DOMContentLoaded', () => {
  const productCards = document.querySelectorAll('.product-card');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const searchInput = document.getElementById('searchInput');
  const noResults = document.getElementById('noResults');

  function applyFilters() {
    const activeCategory = document.querySelector('.filter-btn.active')?.dataset.filter || 'All';
    const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
    let visibleCount = 0;

    productCards.forEach(card => {
      const cardCategory = card.dataset.cat;
      const cardTitle = card.dataset.name.toLowerCase();

      const matchesCat = (activeCategory === 'All' || cardCategory === activeCategory);
      const matchesSearch = cardTitle.includes(searchQuery);

      if (matchesCat && matchesSearch) {
        card.style.display = 'flex';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });

    if (noResults) {
      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    }
  }

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    });
  });

  if (searchInput) {
    searchInput.addEventListener('input', applyFilters);
  }
});
</script>
